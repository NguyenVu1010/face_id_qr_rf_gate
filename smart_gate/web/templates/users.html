{% extends "base.html" %}
{% block title %}Users{% endblock %}
{% block body %}
<h2>Users</h2>
<table>
  <thead><tr><th>id</th><th>name</th><th>created</th><th>last seen</th><th>#enc</th><th>active QR</th></tr></thead>
  <tbody>
  {% for u in users %}
    <tr><td>{{ u[0] }}</td><td>{{ u[1] }}</td><td>{{ u[2] }}</td><td>{{ u[3] or "-" }}</td><td>{{ u[4] }}</td><td>{{ "y" if u[5] else "n" }}</td></tr>
  {% endfor %}
  </tbody>
</table>
{% endblock %}
