{% for r in rows %}
<tr data-event-id="{{ r.id }}">
  <td class="mono ts"><span class="ts-utc-full" data-utc="{{ r.ts }}">{{ r.ts }}</span></td>
  <td><span class="pill pill-{{ r.method }}">{{ r.method }}</span></td>
  <td>{{ r.user_name or "—" }}</td>
  <td class="cell-ok">
    {% if r.granted %}<span class="ok-icon">✓</span>
    {% else %}<span class="deny-icon">✗</span>{% endif %}
  </td>
  <td>
    {% if r.clip_path %}
      <a href="#" class="clip-link"
         data-event-id="{{ r.id }}"
         data-ts="{{ r.ts }}"
         data-user="{{ r.user_name or '' }}">▶</a>
    {% else %}—{% endif %}
  </td>
  <td class="mono detail">{{ r.detail or "" }}</td>
</tr>
{% endfor %}
